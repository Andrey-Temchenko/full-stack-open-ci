name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Check style
        run: npm run eslint

      - name: Run npm test
        run: npm test

      - name: Run npm build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

  deploy:
    needs: [build_and_test]
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}

    steps:
      - name: Trigger deployment
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' && needs.deploy.result == 'success' }}

    steps:
      - name: Discord success notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ Deployment Successful!"
          description: |
            Deployment pipeline

            Repository
            ${{ github.repository }}

            Branch
            ${{ github.ref_name }}

            Event
            ${{ github.event_name }}

            Commit
            ${{ github.sha }}

            Message
            ${{ github.event.head_commit.message }}

            Triggered by
            ${{ github.actor }}

            Workflow
            ${{ github.workflow }}

            Commit:
            ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

  notify_failure:
    needs: [deploy]
    runs-on: ubuntu-latest

    if: ${{ needs.deploy.result == 'failure' }}

    steps:
      - name: Discord failure notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "❌ Deployment Failed!"
          description: |
            Deployment pipeline failed.

            Repository
            ${{ github.repository }}

            Branch
            ${{ github.ref_name }}

            Event
            ${{ github.event_name }}

            Commit
            ${{ github.sha }}

            Message
            ${{ github.event.head_commit.message }}

            Triggered by
            ${{ github.actor }}

            Workflow
            ${{ github.workflow }}

            Commit:
            ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            Workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') && needs.deploy.result == 'success' }}

    steps:
      - uses: actions/checkout@v6

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch