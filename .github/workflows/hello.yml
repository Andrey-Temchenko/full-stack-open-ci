name: Hello World!

on:
  push:
    branches:
      - main

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello World!"
  run_date:
    runs-on: ubuntu-latest
    steps:
      - name: Print current date
        run: date
  run_ls:
    runs-on: ubuntu-latest
    steps:
      - name: List files in the repository
        run: ls -l