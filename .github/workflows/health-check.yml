name: Periodic health check

on:
  # Allows manual execution of the workflow from the GitHub Actions tab.
  workflow_dispatch:
  # Temporarily disabled scheduled health checks to conserve free GitHub Actions minutes.
  # Re-enable if automated daily checks are required.
  # schedule:
  # - cron: '*/15 * * * *' 

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://full-stack-open-ci-iu5s.onrender.com/health
          max-attempts: 3
          retry-delay: 5s